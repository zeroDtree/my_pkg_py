site_name: mlkit

nav:
  - Home: index.md
  - Training: training.md
  - Learning rate: learning-rate.md
  - API Reference:
    - Overview: api/index.md
    - diffusion: api/diffusion.md
    - flow_matching: api/flow_matching.md
    - pipeline: api/pipeline.md
    - model: api/model.md
    - dataset: api/dataset.md
    - optimizer: api/optimizer.md
    - scheduler: api/scheduler.md
    - util: api/util.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - path: javascripts/mermaid.mjs
    type: module

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_source: true
            show_root_heading: true
            annotations_path: brief
            members_order: source
            show_if_no_docstring: false
